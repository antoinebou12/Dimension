<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedding — Dimension</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #1a1a1e;
      --card: #25252a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #0a84ff;
      --border: #333;
      --radius: 8px;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .cta {
      display: inline-block;
      padding: 1rem 1.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius);
      margin-top: 1rem;
    }
    .cta:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Embedding</h1>
  <p class="subtitle">Text embeddings reduced to 3D with PCA. Click points to see similar documents.</p>
