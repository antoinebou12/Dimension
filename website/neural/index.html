<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural — Dimension</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #1a1a1e;
      --card: #25252a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #0a84ff;
      --border: #333;
      --radius: 8px;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 2rem; }
    .demo-list { list-style: none; padding: 0; margin: 0; }
    .demo-list a {
      display: block;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: inherit;
      text-decoration: none;
      margin-bottom: 0.5rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .demo-list a:hover {
      border-color: var(--accent);
      background: #2a2a2e;
    }
  </style>
</head>
<body>
  <h1>Neural</h1>
  <p class="subtitle">Embedding and vectorization for text, image, graph, and point cloud.</p>
  <ul class="demo-list" role="list">
    <li><a href="embedding/">Embedding — Text in 3D (PCA) and similar documents</a></li>
    <li><a href="../mathlib/recommendation/">mathlib Recommendation — Interactive 3D scatter of text embeddings</a></li>
  </ul>
  <p style="margin-top: 2rem;"><a href="../">← Back to hub</a></p>
</body>
</html>
