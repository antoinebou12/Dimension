<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geometry-demo — Mesh demos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1e; }
    canvas { display: block; max-width: 100%; height: auto; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #error { display: none; max-width: 40rem; padding: 1rem; margin: 1rem; background: #2d2d33; color: #e0e0e0; border-radius: 6px; font-family: system-ui, sans-serif; font-size: 0.9rem; }
    #error.visible { display: block; }
    p.hint { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
    #hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      font-family: ui-monospace, monospace; font-size: 12px; color: #888; pointer-events: none; user-select: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="hint">Left drag: orbit  |  Scroll: zoom</div>
  <div id="error">
    <strong>Setup required</strong>
    <p id="error-message"></p>
  </div>
  <script type="module">
    try {
      const init = (await import('./pkg/geometry_wasm.js')).default;
      await init();
    } catch (e) {
      const el = document.getElementById('error');
      const msg = document.getElementById('error-message');
      if (el && msg) {
        msg.textContent = String(e);
        el.classList.add('visible');
      }
    }
  </script>
</body>
</html>
