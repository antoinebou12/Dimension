syntax = "proto3";

package network;

// --- Core math types ---

/// 3D vector (x, y, z). Maps to mathlib Vector3f, collision positions.
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

/// Quaternion (x, y, z, w). Maps to mathlib Quat4f.
message Quat4 {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

/// Transform: position, Euler rotation (radians), scale. Maps to render Transform.
message Transform {
  Vec3 position = 1;
  Vec3 rotation = 2;  // roll, pitch, yaw in radians
  Vec3 scale = 3;
}

/// RGBA color (0-1).
message Color {
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;
}

// --- Primitive types (maps to render Primitive) ---

enum PrimitiveType {
  PRIMITIVE_TYPE_UNSPECIFIED = 0;
  PRIMITIVE_TYPE_QUAD = 1;
  PRIMITIVE_TYPE_SQUARE = 2;
  PRIMITIVE_TYPE_CIRCLE = 3;
  PRIMITIVE_TYPE_TRIANGLE = 4;
  PRIMITIVE_TYPE_CUBE = 5;
  PRIMITIVE_TYPE_SPHERE = 6;
  PRIMITIVE_TYPE_CYLINDER = 7;
}

/// Entity state: id, transform, primitive, color. Maps to render entity with NodeData.
message EntityState {
  uint64 id = 1;
  Transform transform = 2;
  PrimitiveType primitive_type = 3;
  Color color = 4;
}

/// AABB bounds. Maps to collision Aabb.
message AabbState {
  Vec3 min = 1;
  Vec3 max = 2;
}

/// Joint state for kinematics. Maps to kinematics JointData.
message JointState {
  uint64 id = 1;
  string variant = 2;   // fixed, revolute, prismatic, spherical
  float angle_or_offset = 3;
  Transform transform = 4;
}

// --- World state ---

/// Full world snapshot: all entities at a given tick.
message WorldSnapshot {
  repeated EntityState entities = 1;
  uint64 tick = 2;
  double timestamp = 3;
}

/// Incremental delta: changed/removed entities between ticks.
message WorldDelta {
  repeated EntityState changed = 1;
  repeated uint64 removed = 2;
  uint64 from_tick = 3;
  uint64 to_tick = 4;
}

// --- Game commands ---

/// Input command (e.g. move, look).
message InputCommand {
  Vec3 move_direction = 1;
  Vec3 look_direction = 2;
}

/// Transform update for an entity.
message TransformUpdateCommand {
  uint64 entity_id = 1;
  Transform transform = 2;
}

/// Game command: one of input, spawn, despawn, transform_update.
message GameCommand {
  oneof payload {
    InputCommand input = 1;
    uint64 spawn = 2;
    uint64 despawn = 3;
    TransformUpdateCommand transform_update = 4;
  }
}

// --- Lobby ---

message CreateRoomRequest {
  string room_name = 1;
  uint32 max_players = 2;
}

message CreateRoomResponse {
  string room_id = 1;
}

message JoinRoomRequest {
  string room_id = 1;
  string player_name = 2;
}

message JoinRoomResponse {
  bool success = 1;
  string message = 2;
}

message LeaveRoomRequest {
  string room_id = 1;
}

message LeaveRoomResponse {
  bool success = 1;
}

message RoomInfo {
  string room_id = 1;
  string room_name = 2;
  uint32 current_players = 3;
  uint32 max_players = 4;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated RoomInfo rooms = 1;
}

// --- Lobby gRPC Service ---

service Lobby {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
}
