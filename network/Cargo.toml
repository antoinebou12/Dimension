[package]
name = "network"
version = "0.1.0"
edition = "2021"
authors = ["Dimension"]
description = "Network crate for Dimension: gRPC, HTTP/REST, WebSocket with Protocol Buffers"
license = "MIT"
repository = "https://github.com/dimension/dimension"
documentation = "https://docs.rs/network"
readme = "README.md"
keywords = ["network", "grpc", "websocket", "http", "game", "multiplayer"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.93"

[lib]
name = "network"
path = "src/lib.rs"

[features]
default = []
grpc = []
http = ["dep:axum", "dep:tower-http"]
websocket = ["dep:axum", "dep:tokio-tungstenite", "dep:futures-util"]
full = ["grpc", "http", "websocket"]
simd = ["mathlib/simd"]
parallel = ["mathlib/parallel", "dep:par-core"]
server = ["grpc", "http", "websocket"]
client = ["grpc", "dep:tokio-tungstenite"]

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dependencies]
mathlib = { path = "../mathlib", default-features = false }
render = { path = "../render", default-features = false, optional = true }
collision = { path = "../collision", default-features = false }
kinematics = { path = "../kinematics", default-features = false, optional = true }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
axum = { version = "0.8", optional = true, features = ["ws"] }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true }
par-core = { version = "2.0", optional = true, default-features = false, features = ["chili"] }

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
tokio-stream = "0.1"
tower = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "serialization"
path = "tests/serialization.rs"

[[test]]
name = "grpc"
path = "tests/grpc.rs"
required-features = ["grpc"]

[[test]]
name = "http"
path = "tests/http.rs"
required-features = ["http"]

[[test]]
name = "websocket"
path = "tests/websocket.rs"
required-features = ["websocket"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["server"]

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["client"]

[[example]]
name = "echo"
path = "examples/echo.rs"

[[bench]]
name = "serialization"
harness = false
