# Corrections take the form of a key/value pair. The key is the incorrect word
# and the value is the correct word. If the key and value are the same, the
# word is treated as always correct. If the value is an empty string, the word
# is treated as always incorrect.

[files]
extend-exclude = [
    ".git/",
    "**/wasm-demo/pkg/",  # wasm-bindgen generated JS (hash suffixes trigger false positives)
    "website/**/pkg/",
    "**/pkg/",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "\\bPolygon::PN\\b",
]

# Case sensitive, matches entire word.
[default.extend-identifiers]
anc_color = "anc_color"
ba = "ba"
rady = "rady"

# Case insensitive, matches inside word.
[default.extend-words]
ba = "ba"
bellow = "below"
toi = "toi"

# WGSL shaders (render/shaders/*.wgsl)
[type.wgsl]
extend-glob = ["*.wgsl"]

[type.wgsl.extend-identifiers]
pn = "pn"
