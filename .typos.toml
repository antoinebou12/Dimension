# Corrections take the form of a key/value pair. The key is the incorrect word
# and the value is the correct word. If the key and value are the same, the
# word is treated as always correct. If the value is an empty string, the word
# is treated as always incorrect.

[files]
extend-exclude = [
    ".git/",
    ".skill/",             # external skill/rules (examples with intentional typos)
    "**/wasm-demo/pkg/",  # wasm-bindgen generated JS (hash suffixes trigger false positives)
    "website/**/pkg/",
    "**/pkg/",
    "**/*.ttf",       # binary fonts (CSS/class text triggers false positives)
    "render/fonts/",  # font files
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "\\bPolygon::PN\\b",
    "NdArray",           # Burn/ndarray backend (Nd + Array)
    "NdArrayDevice",
]

# Case sensitive, matches entire word.
[default.extend-identifiers]
anc_color = "anc_color"
ba = "ba"
ndarray = "ndarray"   # burn::backend::ndarray
NdArray = "NdArray"    # Burn backend name
NdArrayDevice = "NdArrayDevice"
pn = "pn"
rady = "rady"
iz = "iz"    # z-axis index or inertia I_z
fo = "fo"    # e.g. CSS class fragments in binaries
Nd = "Nd"    # NdArray, NdArrayDevice (Burn backend)
consts = "consts"   # std::f32::consts / std::f64::consts (Rust API)
Comput = "Comput"  # SIAM J. Sci. Comput. (abbreviation for Computing)

# Case insensitive, matches inside word.
[default.extend-words]
ba = "ba"
bellow = "below"
toi = "toi"
iz = "iz"   # z-axis index (e.g. for iz in 0..nz) or inertia I_z
gti = "gti" # e.g. gti320-style format name
fo = "fo"   # e.g. CSS class fragments in font/binaries
Nd = "Nd"   # NdArray, NdArrayDevice (Burn/ndarray backend names)
consts = "consts"   # std::f32::consts / std::f64::consts (Rust API)

# WGSL shaders (render/shaders/*.wgsl)
[type.wgsl]
extend-glob = ["*.wgsl"]

[type.wgsl.extend-identifiers]
pn = "pn"
