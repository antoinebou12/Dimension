# Pre-commit hooks — https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  rust: stable

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Spelling (uses .typos.toml from repo root; default: fix in place)
  - repo: https://github.com/crate-ci/typos
    rev: v1.26.0
    hooks:
      - id: typos

  # Rust: format and clippy (run from repo root; crate in mathlib/)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (mathlib)
        entry: bash -c "cd mathlib && cargo fmt -- --check"
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (mathlib)
        entry: bash -c "cd mathlib && cargo clippy -- -D warnings"
        language: system
        pass_filenames: false
