# Pre-commit hooks — https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  rust: stable

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^(website/.*/pkg/|kinematics/demo/(pkg/|wasm-demo/pkg/)|render/demo/wasm-demo/pkg/|physics/demo/wasm-demo/pkg/)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Spelling (uses .typos.toml from repo root; default: fix in place)
  - repo: https://github.com/crate-ci/typos
    rev: v1.26.0
    hooks:
      - id: typos
        args: [--force-exclude]

  # Rust: format and clippy (workspace-wide format; mathlib clippy)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (workspace)
        entry: bash -c "cargo fmt --all -- --check"
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (mathlib)
        entry: bash -c "cargo clippy -p mathlib -- -D warnings -A clippy::multiple_crate_versions"
        language: system
        pass_filenames: false
      - id: cargo-coverage
        name: cargo tarpaulin (mathlib)
        entry: bash -c "cd mathlib && cargo tarpaulin --features \"parallel genetic\" --out Html --out Stdout --output-dir coverage --timeout 300"
        language: system
        pass_filenames: false
        stages: [pre-push]
