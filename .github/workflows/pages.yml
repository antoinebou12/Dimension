# Build unified website and deploy to GitHub Pages.
# Enable in repo: Settings → Pages → Build and deployment → GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    # Sequence: setup Rust → cache/install tools → rebuild website → fix base path → verify → deploy
    steps:
      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          cache-targets: wasm32-unknown-unknown

      - name: Cache cargo-installed tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: pages-cargo-bin-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'mathlib/Cargo.toml') }}

      - name: Install Pages tools
        run: cargo install wasm-pack just wasm-bindgen-cli --locked

      # Sequential rebuild: clean demo dirs then build all WASM demos (no stale output).
      - name: Rebuild website
        run: ./.github/scripts/rebuild-website.sh

      - name: Fix base path for Project Pages
        run: ./.github/scripts/fix-pages-base-path.sh

      - name: Verify site root and demo pages
        run: ./.github/scripts/verify-pages-artifact.sh

      # Pages must be enabled in repo: Settings → Pages → Build and deployment → GitHub Actions.
      # enablement: true would require a PAT; GITHUB_TOKEN cannot create a Pages site.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
