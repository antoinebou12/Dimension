# Build unified website and deploy to GitHub Pages.
# Enable in repo: Settings → Pages → Build and deployment → GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: wasm32-unknown-unknown

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install just
        run: cargo install just --locked

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build unified website
        run: just website-build

      # Ensure root index.html exists (e.g. if ignored by git so missing in checkout)
      - name: Ensure site root has index
        run: |
          if ! test -f website/index.html; then
            echo "Creating website/index.html (missing after build)"
            cat > website/index.html << 'HUB'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Dimension — WASM demos</title>
            <style>
              * { box-sizing: border-box; }
              body { margin: 0; min-height: 100vh; background: #1a1a1e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 2rem; }
              .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; list-style: none; padding: 0; }
              .demo-grid a { display: block; padding: 1.25rem; background: #25252a; border: 1px solid #333; border-radius: 8px; color: inherit; text-decoration: none; }
              .demo-grid a:hover { border-color: #0a84ff; }
            </style>
          </head>
          <body>
            <h1>Dimension — WASM demos</h1>
            <p class="subtitle">Linear algebra, 3D rendering, kinematics, physics, geometry, and neural — all in WebAssembly.</p>
            <ul class="demo-grid" role="list">
              <li><a href="mathlib/"><strong>Mathlib</strong><span>Linear algebra, ML, graph, optimization, noise, transforms, camera</span></a></li>
              <li><a href="render/"><strong>Render</strong><span>3D cube, tetrahedron, cylinder with gizmo and picking</span></a></li>
              <li><a href="kinematics/"><strong>Kinematics</strong><span>3-joint arm with FABRIK, Halley, Neural IK</span></a></li>
              <li><a href="physics/"><strong>Physics</strong><span>PBD particles</span></a></li>
              <li><a href="geometry/"><strong>Geometry</strong><span>Mesh demos</span></a></li>
              <li><a href="neural/embedding/"><strong>Embedding</strong><span>Text embeddings in 3D (PCA). Click points, see similar documents.</span></a></li>
              <li><a href="neural/"><strong>Neural</strong><span>Neural hub: embedding space, neural IK</span></a></li>
            </ul>
          </body>
          </html>
          HUB
          fi

      # Rewrite absolute paths for GitHub Project Pages (site is served at /<repo>/ not /)
      - name: Fix base path for Project Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          find website -type f \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 sed -i \
            -e "s|base href=\"/|base href=\"/$REPO_NAME/|g" \
            -e "s|href=\"/\"|href=\"/$REPO_NAME/\"|g" \
            -e "s|href=\"/mathlib/|href=\"/$REPO_NAME/mathlib/|g" \
            -e "s|href=\"/neural/|href=\"/$REPO_NAME/neural/|g" \
            -e "s|href=\"/kinematics/|href=\"/$REPO_NAME/kinematics/|g" \
            -e "s|href=\"/physics/|href=\"/$REPO_NAME/physics/|g" \
            -e "s|href=\"/geometry/|href=\"/$REPO_NAME/geometry/|g" \
            -e "s|href=\"/render/|href=\"/$REPO_NAME/render/|g" \
            -e "s|src=\"/|src=\"/$REPO_NAME/|g" \
            -e "s|import(\"/|import(\"/$REPO_NAME/|g" \
            -e "s|fetch(\"/|fetch(\"/$REPO_NAME/|g"

      - name: Verify site root
        run: |
          test -f website/index.html || (echo "Missing website/index.html" && exit 1)
          echo "Artifact root contents:"
          ls -la website/
          echo "index.html present:"
          head -5 website/index.html

      # Pages must be enabled in repo: Settings → Pages → Build and deployment → GitHub Actions.
      # enablement: true would require a PAT; GITHUB_TOKEN cannot create a Pages site.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
