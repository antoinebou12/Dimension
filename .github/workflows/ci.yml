name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy (mathlib)
        run: cargo clippy -p mathlib --all-targets -- -D warnings

      - name: Test (mathlib)
        run: cargo test -p mathlib

      - name: Doc test (mathlib)
        run: cargo test -p mathlib --doc

      - name: Build examples (mathlib)
        run: cargo build -p mathlib --examples

  test-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parse

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Test parse (all formats)
        run: cargo test --features "json,bjson,toon,xml,obj,mtl,bvh,gltf,ply,image,archive"

  test-features:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathlib

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Test with parallel feature
        run: cargo test --features parallel

      - name: Test with full feature
        run: cargo test --features full

  test-gpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathlib

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Test GPU
        run: cargo test --features gpu --test gpu

      - name: Build GPU examples
        run: cargo build --examples --features gpu

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1
        with:
          config: .typos.toml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Generate lockfile for audit
        run: cargo check -p mathlib

      - name: Audit dependencies
        run: cargo audit

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathlib

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # Reproduce locally: just coverage-xml (from repo root)
      - name: Run coverage
        run: cargo tarpaulin --features "parallel genetic" --out Xml --out Html --output-dir coverage --timeout 300

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: mathlib/coverage/

      # Optional: upload to Codecov for badges and PR comments (add CODECOV_TOKEN in repo secrets)
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: mathlib/coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathlib

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          cache-targets: wasm32-unknown-unknown

      - name: Check WASM build (default features)
        run: cargo build --target wasm32-unknown-unknown

      - name: Check WASM build (wasm feature)
        run: cargo check --target wasm32-unknown-unknown --features wasm

  wasm-gpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathlib

    steps:
      - uses: actions/checkout@v6
      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          cache-targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM with GPU
        run: wasm-pack build --target web --features "wasm gpu"
