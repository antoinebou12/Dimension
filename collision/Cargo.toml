[package]
name = "collision"
version = "0.1.0"
edition = "2021"
authors = ["Dimension"]
description = "Collision and spatial queries: AABB, ray, frustum, BSP, BVH, sphere, OBB, capsule"
license = "MIT"
repository = "https://github.com/dimension/dimension"
documentation = "https://docs.rs/collision"
readme = "README.md"
keywords = ["collision", "aabb", "ray", "frustum", "bsp", "bvh", "culling"]
categories = ["graphics", "mathematics"]
rust-version = "1.93"

[lib]
name = "collision"
path = "src/lib.rs"

[features]
default = []
simd = ["mathlib/simd", "dep:wide"]
# Parallel BVH build and batch queries. Not available on wasm32 (par-core/chili).
parallel = ["mathlib/parallel", "dep:par-core"]

[dependencies]
mathlib = { path = "../mathlib", default-features = false }
wide = { version = "0.7", optional = true, default-features = false }
par-core = { version = "2.0", optional = true, default-features = false, features = ["chili"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "collision"
harness = false
