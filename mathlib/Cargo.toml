[package]
name = "mathlib"
version = "0.1.0"
authors = ["Dimension"]
description = "Linear algebra library: dense/sparse matrices, vectors, SVD, 3D math"
keywords = ["algebra", "linear-algebra", "matrix", "sparse", "simd", "math"]
readme = "README.md"
repository = "https://github.com/dimension/dimension"
categories = ["science", "mathematics", "wasm"]
documentation = "https://docs.rs/mathlib"
license = "MIT"
edition = "2024"
rust-version = "1.93"

[badges]
maintenance = { status = "actively-developed" }

[lib]
name = "mathlib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Feature matrix: wasm builds use --features wasm or "wasm simd" only (parallel not supported on wasm32).
[features]
default = []
serde = ["dep:serde"]
parallel = ["dep:par-iter", "dep:par-core", "par-core/chili"]
simd = ["dep:wide"]
full = ["parallel", "simd"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-shared", "dep:js-sys", "dep:wasm-bindgen-futures"]
genetic = ["dep:rand", "dep:rand_distr"]
gpu = ["dep:wgpu", "dep:wasm-bindgen-futures", "dep:futures"]

[dependencies]
tracing = "0.1"
serde = { version = "1", optional = true, features = ["derive"] }
par-iter = { version = "2.0", optional = true, default-features = false }
par-core = { version = "2.0", optional = true, default-features = false }
wide = { version = "0.7", optional = true, default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-shared = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.6", optional = true }
wgpu = { version = "28", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
forte = "1.0.0-alpha"

[package.metadata.docs.rs]
all-features = true

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt when system binaryen is too old (e.g. "invalid code after misc prefix").
# Set to ["-Oz"] to enable if your wasm-opt supports the emitted WASM.
wasm-opt = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = false

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.release-wasm]
inherits = "release"
debug = false
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
criterion = "0.5"
image = "0.25"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

